name: docker-build

# Build immagini e test di avvio dello stack Compose (fase 08).
#  - valida `docker compose config` (base, dev, coolify);
#  - costruisce le immagini di api, worker e admin;
#  - avvia lo stack e verifica gli healthcheck;
#  - push su registry OPZIONALE (solo se REGISTRY_* è configurato tra i secret);
#  - il deploy Coolify avviene via webhook documentato, senza secret hardcoded.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/admin/**"
      - "packages/**"
      - "infra/docker/**"
      - "docker-compose*.yml"
      - "pnpm-lock.yaml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config (base + dev)
        run: >-
          docker compose --env-file infra/docker/dev.env
          -f docker-compose.yml -f docker-compose.dev.yml config

      - name: Validate compose config (coolify)
        env:
          PUBLIC_API_URL: https://api.example.com
        run: >-
          docker compose --env-file infra/docker/dev.env
          -f docker-compose.coolify.yml config

      - name: Build images
        run: >-
          docker compose --env-file infra/docker/dev.env
          -f docker-compose.yml -f docker-compose.dev.yml build

      - name: Start stack
        run: >-
          docker compose --env-file infra/docker/dev.env
          -f docker-compose.yml -f docker-compose.dev.yml up -d

      - name: Run database migrations
        run: >-
          docker compose --env-file infra/docker/dev.env
          -f docker-compose.yml -f docker-compose.dev.yml
          run --rm api node dist/migrate.js

      - name: Wait for healthy services
        run: |
          set -euo pipefail
          services="api worker admin postgres redis"
          for i in $(seq 1 60); do
            unhealthy=""
            for s in $services; do
              cid="$(docker compose --env-file infra/docker/dev.env -f docker-compose.yml -f docker-compose.dev.yml ps -q "$s")"
              status="$(docker inspect -f '{{ if .State.Health }}{{ .State.Health.Status }}{{ else }}none{{ end }}' "$cid" 2>/dev/null || echo missing)"
              if [ "$status" != "healthy" ]; then
                unhealthy="$unhealthy $s($status)"
              fi
            done
            if [ -z "$unhealthy" ]; then
              echo "Tutti i servizi sono healthy."
              exit 0
            fi
            echo "In attesa:$unhealthy"
            sleep 5
          done
          echo "Timeout: servizi non healthy."
          docker compose --env-file infra/docker/dev.env -f docker-compose.yml -f docker-compose.dev.yml ps
          exit 1

      - name: Smoke test endpoints
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/health/live
          curl -fsS http://localhost:3000/health/ready
          curl -fsS http://localhost:3001/api/health

      - name: Dump logs on failure
        if: failure()
        run: >-
          docker compose --env-file infra/docker/dev.env
          -f docker-compose.yml -f docker-compose.dev.yml logs --no-color

      - name: Tear down
        if: always()
        run: >-
          docker compose --env-file infra/docker/dev.env
          -f docker-compose.yml -f docker-compose.dev.yml down -v

  # Push su registry: attivo SOLO se i secret sono configurati. Nessun valore
  # segreto è scritto nel workflow. Coolify può poi fare pull di queste immagini
  # oppure ricostruire dal repository.
  push:
    needs: compose
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check registry configuration
        id: cfg
        run: |
          if [ -n "${{ secrets.REGISTRY_USERNAME }}" ] && [ -n "${{ secrets.REGISTRY_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Registry non configurato: push saltato."
          fi

      - name: Log in to registry
        if: steps.cfg.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Buildx
        if: steps.cfg.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          reg="${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_NAMESPACE }}"
          tag="${GITHUB_SHA::7}"
          for app in api worker admin; do
            docker buildx build \
              -f "infra/docker/Dockerfile.${app}" \
              -t "${reg}/businessbox-${app}:${tag}" \
              -t "${reg}/businessbox-${app}:latest" \
              --push .
          done

  # Deploy Coolify: opzionale, via webhook. Il token NON è nel repository;
  # si imposta come secret. Coolify ricostruisce dallo stesso Compose.
  deploy:
    needs: push
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_WEBHOOK}" ] || [ -z "${COOLIFY_TOKEN}" ]; then
            echo "Coolify non configurato (COOLIFY_WEBHOOK_URL/COOLIFY_TOKEN assenti): deploy saltato."
            exit 0
          fi
          curl -fsS -X POST "${COOLIFY_WEBHOOK}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
          echo "Deploy Coolify avviato."
