# Packaging desktop (electron-builder).
# Branding allineato a packages/shared/src/branding.ts — se cambia lì, cambia anche qui.
appId: com.businessbox.browser
productName: BusinessBox Browser
executableName: businessbox-browser

directories:
  output: release
  buildResources: build

# electron-vite bundla tutto in out/ (main CJS, preload, renderer):
# nessuna dipendenza node_modules necessaria a runtime in fase 00.
files:
  - out/**
  - "!out/**/*.map"

asar: true
npmRebuild: false
nodeGypRebuild: false

# Nome letterale: ${name} risolverebbe "@businessbox/desktop" e la "/" romperebbe il percorso.
artifactName: businessbox-browser-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Alpha senza certificati Apple: electron-builder applica la firma AD-HOC
  # (obbligatoria su Apple Silicon: senza firma macOS segnala "danneggiato").
  # Niente notarization simulata (prompt 09); firma reale con certificati in fase 09.
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch: [x64]
  # La verifica della firma degli update NON viene disabilitata: con un
  # certificato reale (fase di rilascio firmata) l'update verifica il publisher.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: businessbox-browser-${version}-${arch}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Network
  maintainer: BusinessBox

# Auto-update predisposto (electron-updater). Canale allineato al branding
# (alpha). Il feed reale si imposta al momento del rilascio; qui il provider è
# generico e in CI si usa `--publish never`, quindi nessun upload avviene ora.
# La verifica di firma/integrità resta sempre attiva (vedi src/main/updater.ts).
publish:
  - provider: generic
    url: https://updates.businessbox.example/${channel}
    channel: alpha
